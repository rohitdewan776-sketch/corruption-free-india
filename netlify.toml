[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; connect-src 'self' https://luzjxwwjhxysxwhkzydd.supabase.co https://api.rss2json.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://luzjxwwjhxysxwhkzydd.supabase.co; frame-src https://www.youtube-nocookie.com https://player.vimeo.com https://www.dailymotion.com; font-src 'self' data: https://cdnjs.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
